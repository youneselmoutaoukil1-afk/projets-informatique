<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آلة حاسبة بسيطة</title>
    <style>
        /* تنسيق الشكل الخارجي (CSS) */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            
            margin: 0;
        }
        .calculator {
           
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(12, 60, 19, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        input {
            padding: 10px;
            font-size: 18px;
            text-align: center;
            width: 150px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .buttons {
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 20px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #e0e0e0;
            transition: 0.2s;
        }
        button:hover {
            background-color: #d0d0d0;
        }
        #result {
            background-color: #e8f0fe;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="number" id="num1" placeholder="الرقم الأول" value="10">
        <input type="number" id="num2" placeholder="الرقم الثاني" value="5">
        
        <div class="buttons">
            <button onclick="calculate('+')">+</button>
            <button onclick="calculate('-')">-</button>
            <button onclick="calculate('*')">x</button>
        </div>
        
        <input type="text" id="result" placeholder="النتيجة" value="15" readonly>
    </div>

    <script>
        function calculate(operator) {
            // جلب الأرقام من الحقول وإجراء العمليات الحسابية
            const num1 = parseFloat(document.getElementById('num1').value);
            const num2 = parseFloat(document.getElementById('num2').value);
            const resultField = document.getElementById('result');

            if (isNaN(num1) || isNaN(num2)) {
                resultField.value = "أدخل أرقاماً!";
                return;
            }

            let result = 0;
            if (operator === '+') {
                result = num1 + num2;
            } else if (operator === '-') {
                result = num1 - num2;
            } else if (operator === '*') {
                result = num1 * num2;
            }

            resultField.value = result;
        }
    </script>

</body>
</html>
